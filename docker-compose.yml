version: '3.8'

services:
  # NOTE: MySQL отключен - используем существующий на хосте
  # mysql:
  #   image: mysql:8.0
  #   container_name: ocr-mysql
  #   ...

  # vLLM Server for DeepSeek-OCR (требует vLLM v0.11+)
  # v0.12.0 требует CUDA 12.9+, у нас CUDA 12.8, поэтому v0.11.2
  vllm-ocr:
    image: vllm/vllm-openai:v0.11.2
    container_name: vllm-ocr
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_TOKEN=${HF_TOKEN:-}
    ports:
      - "8001:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      --model deepseek-ai/DeepSeek-OCR
      --trust-remote-code
      --max-model-len 4096
      --gpu-memory-utilization 0.4
      --enable-prefix-caching false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # vLLM Server for Qwen (структуризация)
  # v0.12.0 требует CUDA 12.9+, у нас CUDA 12.8, поэтому v0.11.2
  vllm-qwen:
    image: vllm/vllm-openai:v0.11.2
    container_name: vllm-qwen
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_TOKEN=${HF_TOKEN:-}
    ports:
      - "8002:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      --model Qwen/Qwen2.5-7B-Instruct
      --trust-remote-code
      --max-model-len 8192
      --gpu-memory-utilization 0.5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr-backend
    restart: unless-stopped
    environment:
      # Используем существующий MySQL на хосте (host.docker.internal)
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-root}:${MYSQL_PASSWORD}@host.docker.internal:3306/${MYSQL_DATABASE:-ocr_documents}
      - VLLM_OCR_URL=http://vllm-ocr:8000
      - VLLM_QWEN_URL=http://vllm-qwen:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
